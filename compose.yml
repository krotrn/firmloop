name: firmloop

x-health-py: &health-py
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    image: firmloop-frontend:dev
    ports:
      - "127.0.0.1:3000:3000"
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    image: firmloop-backend:dev
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./hardware:/repo/hardware:ro
      - ./firmware:/repo/firmware:ro
      - ./benchmark:/repo/benchmark:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      runner:
        condition: service_healthy
    networks: [app, sandbox, tools]
    healthcheck:
      <<: *health-py
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]

  runner:
    build:
      context: ./runner
      additional_contexts:
        firmware: ./firmware
    image: firmloop-runner:dev
    read_only: true
    tmpfs:
      - /work:size=64m,exec,mode=1777
      - /tmp:size=64m,mode=1777
    environment:
      TMPDIR: /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    user: "10001:10001"
    volumes:
      - ./firmware:/repo/firmware:ro
    networks: [sandbox]
    healthcheck:
      <<: *health-py
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3)"]

  builder:
    build: ./builder
    image: firmloop-builder:dev
    volumes:
      - arduino-cache:/cache
      - ./firmware:/repo/firmware:ro
      - ./hardware:/repo/hardware:ro
    networks: [tools]
    healthcheck:
      <<: *health-py
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)"]

  device:
    build: ./device
    image: firmloop-device:dev
    environment:
      DEVICE_MODE: ${DEVICE_MODE:-virtual}
      DEVICE_PORT: ${DEVICE_PORT:-}
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
    group_add:
      - "${SERIAL_GID:-986}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [tools]
    healthcheck:
      <<: *health-py
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=3)"]

  ollama:
    image: ollama/ollama:0.40.13
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    networks: [app]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  app: {}
  sandbox:
    internal: true
  tools:
    internal: true

volumes:
  arduino-cache: {}
  ollama: {}
