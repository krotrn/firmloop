[project]
name = "firmloop-runner"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# starlette 1.x nags to use httpx2 for TestClient; httpx2 is not in TECH_STACK (not ours to fix)
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
