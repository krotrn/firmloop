[project]
name = "firmloop-device"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "esptool>=5.6.0",
    "fastapi>=0.162.0",
    "pyserial>=3.5",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
